name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v6
      - name: Check the menu and game scripts
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const file of ['public/index.html', 'public/world/index.html', 'public/bakery/index.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const script = html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
            if (!script) throw new Error('The script is missing from ' + file + '.');
            new Function(script);
            console.log('Script syntax passed: ' + file);
          }
          JS
      - name: Check the menu, gameplay, secret rooms, map, and character choices
        run: node tests/game.cjs
      - name: Check the Mystery Egg Bakery
        run: node tests/bakery.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the game
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
