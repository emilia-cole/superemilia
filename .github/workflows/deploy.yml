name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v6
      - name: Check the menu and game scripts
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const file of ['public/index.html', 'public/world/index.html', 'public/bakery/index.html', 'public/memory/index.html', 'public/garden/index.html', 'public/studio/index.html', 'public/vet/index.html', 'public/race/index.html', 'public/fish/index.html', 'public/hotel/index.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if (!scripts.length) throw new Error('The script is missing from ' + file + '.');
            for (const script of scripts) new Function(script);
            console.log('Script syntax passed: ' + file);
          }
          JS
      - name: Check the menu, gameplay, secret rooms, map, and character choices
        run: node tests/game.cjs
      - name: Check the Mystery Egg Bakery
        run: node tests/bakery.cjs
      - name: Check Memory Match
        run: node tests/memory.cjs
      - name: Check Buddy Garden
        run: node tests/garden.cjs
      - name: Check Dress-Up Studio
        run: node tests/studio.cjs
      - name: Check Pet Vet Clinic
        run: node tests/vet.cjs
      - name: Check Buddy Kart Racing
        run: node tests/race.cjs
      - name: Check Fishing Friends
        run: node tests/fish.cjs
      - name: Check Buddy Hotel
        run: node tests/hotel.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the game
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
