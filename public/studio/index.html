<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe3f1">
<meta name="author" content="Emilia">
<meta name="description" content="Dress up your buddies with hats, outfits, colors, and patterns, then walk the runway in a themed fashion show for the judges. A free dress-up game by Emilia.">
<link rel="canonical" href="https://superemilia.com/studio/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Super Emilia">
<meta property="og:url" content="https://superemilia.com/studio/">
<meta property="og:title" content="Dress-Up Studio · A Super Emilia Game">
<meta property="og:description" content="Dress up your buddies with hats, outfits, colors, and patterns, then walk the runway in a themed fashion show for the judges. A free dress-up game by Emilia.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<title>Dress-Up Studio</title>
<style>
/* Layout: top bar, the theme card for today's show, then the stage (the dressed buddy) beside the wardrobe (tabs + item grid). The runway show opens in a full dialog. */
:root{
 color-scheme:light;
 --bg:#ffe8f3; --bg-2:#f1e6ff; --paper:#fffafd; --line:#f1d3e3; --ink:#3d2440; --soft:#7d6280;
 --rose:#ff6fae; --rose-deep:#d94690; --plum:#8b5cf6; --plum-deep:#6b3fd6; --gold:#ffc93c; --mint:#5ccfa4;
 --round:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(800px 400px at 85% 0,#fff 0,transparent 60%),linear-gradient(160deg,var(--bg),var(--bg-2));color:var(--ink);font-family:var(--round);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 12px;font-weight:800;transition:transform .12s ease}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--plum-deep);outline-offset:2px}
.app{max-width:1000px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px 18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.home{text-decoration:none;font-weight:800;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14px}
.title{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.title small{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--rose-deep);font-weight:800}
.title strong{font-size:20px;letter-spacing:-.4px}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.coins{color:#a06b00;border-color:#f2d98a;background:#fff8dc}
.theme{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--line)}
.theme .ti{font-size:40px;grid-row:span 2;line-height:1}
.theme .tn{font-size:12px;font-weight:800;color:var(--rose-deep);letter-spacing:1px;text-transform:uppercase}
.theme .tn b{font-size:20px;color:var(--ink);letter-spacing:-.3px;text-transform:none;display:block}
.theme .likes{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px;font-weight:700;color:var(--soft)}
.like{border-radius:999px;padding:3px 9px;background:#f6eef8;border:1.5px dashed #d9c3e3;font-weight:800;color:#8d7792}
.like.got{background:#e6fbf1;border:1.5px solid var(--mint);color:#1f7a55}
.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:12px;align-items:start}
.stage{position:relative;border-radius:24px;background:radial-gradient(circle at 50% 30%,#fff 0,#fff0 55%),linear-gradient(180deg,#ffd6ea,#e9dcff);border:3px solid #fff;box-shadow:0 6px 0 #e6c6dc;display:grid;justify-items:center;padding:10px 10px 14px;gap:8px}
.stage .floor{position:absolute;left:10%;right:10%;bottom:58px;height:26px;border-radius:50%;background:#ffffff88}
.doll{width:min(100%,300px);height:auto;position:relative;filter:drop-shadow(0 6px 0 #0000000f)}
.walk{font-size:19px;padding:13px 22px;background:linear-gradient(160deg,var(--rose),var(--plum));border-color:var(--plum-deep);color:#fff;box-shadow:0 4px 0 var(--plum-deep);position:relative}
.stage-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;position:relative}
.wardrobe{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:10px;display:grid;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.tabs button{padding:7px 2px;font-size:12px;display:grid;justify-items:center;gap:1px;border-radius:12px}
.tabs button span{font-size:20px;line-height:1.1}
.tabs button[aria-selected="true"]{background:var(--rose);border-color:var(--rose-deep);color:#fff}
.sub{font-size:12px;font-weight:900;color:var(--soft);letter-spacing:1px;text-transform:uppercase;margin:2px 2px -4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.it{position:relative;display:grid;justify-items:center;gap:2px;padding:8px 4px 6px;border-radius:14px;background:#fff;min-height:78px}
.it .ic{font-size:30px;line-height:1.1;display:grid;place-items:center;height:36px}
.it .ic svg{width:40px;height:36px}
.it .nm{font-size:11px;font-weight:800;line-height:1.1;text-align:center}
.it.on{border-color:var(--rose);box-shadow:0 0 0 2px var(--rose) inset;background:#fff0f7}
.it.locked{background:#f7f2f8}
.it.locked .ic{opacity:.45;filter:grayscale(.6)}
.it .price{position:absolute;top:-6px;right:-4px;background:#fff8dc;border:1.5px solid #f2d98a;border-radius:999px;font-size:10.5px;font-weight:900;padding:1px 6px;color:#8a5a00}
.it .tagdot{position:absolute;top:4px;left:5px;font-size:11px}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.sw{position:relative;width:40px;height:40px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--rose-deep)}
.sw.locked{opacity:.55}
.sw .price{position:absolute;top:-8px;right:-10px;background:#fff8dc;border:1.5px solid #f2d98a;border-radius:999px;font-size:9.5px;font-weight:900;padding:0 4px;color:#8a5a00}
.sw .tagdot{position:absolute;bottom:-6px;right:-6px;font-size:11px}
.hint{margin:0;font-size:12.5px;color:var(--soft);font-weight:700}
/* runway */
#showDialog{width:min(560px,calc(100vw - 16px));max-height:calc(100dvh - 16px);border:none;border-radius:28px;padding:0;background:#2a1838;color:#fff;box-shadow:0 30px 80px #000a;overflow:hidden}
#showDialog::backdrop{background:#1a0d24cc}
.runway{position:relative;height:min(52dvh,400px);overflow:hidden;background:radial-gradient(ellipse 45% 70% at 50% 0,#fff6 0,#fff0 70%),radial-gradient(circle at 10% 20%,#ff6fae55 0 3px,transparent 4px) 0 0/60px 50px,linear-gradient(180deg,#3b2255,#2a1838)}
.runway .path{position:absolute;left:50%;bottom:-20px;width:70%;height:85%;transform:translateX(-50%) perspective(300px) rotateX(48deg);transform-origin:50% 100%;background:repeating-linear-gradient(180deg,#f7d7ea 0 18px,#f0c4de 18px 36px);border-radius:10px 10px 0 0;box-shadow:0 0 40px #ff6fae66}
.runway .model{position:absolute;left:50%;bottom:6%;width:min(52%,220px);transform:translateX(-50%) scale(.35);transform-origin:50% 100%}
.runway.go .model{animation:strut 2.6s cubic-bezier(.3,.1,.3,1) forwards}
.flash{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff0 65%);opacity:0;animation:flash .5s ease-out}
.crowd{position:absolute;bottom:4px;font-size:28px;letter-spacing:4px;filter:drop-shadow(0 2px 0 #0006)}
.crowd.l{left:6px}.crowd.r{right:6px}
.judging{padding:14px 16px 18px;display:grid;gap:12px;justify-items:center;text-align:center}
.judges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.judge{display:grid;justify-items:center;gap:4px}
.judge .face{font-size:38px;line-height:1}
.judge .jn{font-size:11.5px;font-weight:800;color:#e9d6f5}
.card{min-width:64px;padding:6px 10px;border-radius:12px;background:#fff;color:var(--ink);font-size:30px;font-weight:900;transform:rotateX(90deg);transition:transform .35s ease;font-variant-numeric:tabular-nums}
.card.show{transform:rotateX(0)}
.judge .say{font-size:11.5px;font-weight:700;color:#f5d7ff;min-height:28px;opacity:0;transition:opacity .3s}
.judge .say.show{opacity:1}
.total{font-size:20px;font-weight:900}
.bigstars{font-size:42px;letter-spacing:6px;color:#ffffff33;min-height:50px}
.bigstars b{color:var(--gold);display:inline-block;animation:pop .5s ease both}
.bigstars b:nth-child(2){animation-delay:.15s}.bigstars b:nth-child(3){animation-delay:.3s}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.primary{background:linear-gradient(160deg,var(--rose),var(--plum));border-color:#fff;color:#fff;box-shadow:0 4px 0 var(--plum-deep)}
#showDialog button:not(.primary){background:#ffffff1a;border-color:#ffffff44;color:#fff}
dialog.small{border:none;border-radius:22px;padding:0;background:var(--paper);color:var(--ink);width:min(360px,calc(100vw - 24px));box-shadow:0 30px 80px #3d244055}
dialog.small::backdrop{background:#3d244066;backdrop-filter:blur(3px)}
.dlg{padding:20px 18px 18px;display:grid;gap:12px;justify-items:center;text-align:center}
.dlg .big{font-size:56px;line-height:1}
.dlg h2{margin:0;font-size:22px}
.dlg p{margin:0;color:var(--soft);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100vw - 30px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
@keyframes strut{0%{transform:translateX(-50%) scale(.35);bottom:58%}35%{transform:translateX(-56%) scale(.6)}65%{transform:translateX(-44%) scale(.85)}100%{transform:translateX(-50%) scale(1);bottom:4%}}
@keyframes flash{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (max-width:720px){.main{grid-template-columns:1fr}.doll{width:min(62vw,250px)}.title strong{font-size:17px}.theme .ti{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.runway .model{transform:translateX(-50%) scale(1)!important;bottom:4%!important}}
</style>
</head>
<body>
<div class="app">
 <div class="topbar">
  <a class="home" href="/" aria-label="Back to all games">← Games</a>
  <div class="title"><small>Super Emilia</small><strong>Dress-Up Studio</strong></div>
  <span class="chip" id="showsChip" aria-label="Fashion shows">🎤 0</span>
  <span class="chip coins" id="coins" aria-label="Coins">🪙 0</span>
  <button type="button" id="soundBtn" aria-pressed="true">🔊</button>
 </div>
 <section class="theme" aria-label="Today's fashion show">
  <span class="ti" id="themeIcon" aria-hidden="true">👑</span>
  <span class="tn">Today's show<b id="themeName">Royal Ball</b></span>
  <button type="button" id="newTheme" aria-label="Pick a different show">🔀 New show</button>
  <div class="likes" id="likes"></div>
 </section>
 <div class="main">
  <section class="stage" aria-label="Your buddy's outfit">
   <div class="floor"></div>
   <div id="doll" class="doll" role="img" aria-label="Your dressed-up buddy"></div>
   <div class="stage-row"><button type="button" id="randomBtn">🎲 Surprise me</button><button type="button" class="walk" id="walkBtn">✨ Walk the runway!</button></div>
  </section>
  <section class="wardrobe" aria-label="Wardrobe">
   <div class="tabs" role="tablist" id="tabs"></div>
   <div id="panel" style="display:grid;gap:10px"></div>
   <p class="hint">💚 marks things the judges love for this show. 🪙 items can be bought with coins from fashion shows.</p>
  </section>
 </div>
</div>

<dialog id="showDialog" aria-labelledby="showTitle">
 <div class="runway" id="runway"><div class="path"></div><div class="model" id="runwayModel"></div><div class="crowd l" aria-hidden="true">🐶🐧🐹</div><div class="crowd r" aria-hidden="true">🐮🐵🐨</div></div>
 <div class="judging">
  <h2 id="showTitle" style="margin:0;font-size:22px">Here comes the model!</h2>
  <div class="judges" id="judges"></div>
  <div class="total" id="showTotal">&nbsp;</div>
  <div class="bigstars" id="showStars" aria-hidden="true"></div>
  <div class="row" id="showBtns" hidden><button type="button" id="tryBtn">👗 Change outfit</button><button type="button" class="primary" id="nextBtn">Next show →</button></div>
 </div>
</dialog>
<dialog id="buyDialog" class="small" aria-labelledby="buyTitle"><div class="dlg"><div class="big" id="buyIcon" aria-hidden="true"></div><h2 id="buyTitle">Buy this?</h2><p id="buyText"></p><div class="row"><button type="button" id="buyNo">Not now</button><button type="button" class="primary" id="buyYes" style="color:#fff">Buy it!</button></div></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
// ---------- game data ----------
// Every item has tags; a show's theme likes some tags. Price 0 means you start with it.
const MODELS=[
 {id:'kitty',icon:'🐱',name:'Kitty',fur:'#ffd9a8',price:0},{id:'bunny',icon:'🐰',name:'Bunny',fur:'#f3eef0',price:0},{id:'bear',icon:'🐻',name:'Bear',fur:'#c98e5c',price:0},
 {id:'panda',icon:'🐼',name:'Panda',fur:'#f4f4f4',price:20},{id:'fox',icon:'🦊',name:'Fox',fur:'#f29a4a',price:25},{id:'frog',icon:'🐸',name:'Frog',fur:'#8fd16a',price:25},
 {id:'penguin',icon:'🐧',name:'Penguin',fur:'#3b3f4a',price:30},{id:'koala',icon:'🐨',name:'Koala',fur:'#b8bcc6',price:30},{id:'alien',icon:'👽',name:'Alien',fur:'#9be59b',price:40},{id:'unicorn',icon:'🦄',name:'Unicorn',fur:'#fbe7ff',price:50}
];
const HATS=[
 {id:'none',icon:'',name:'No hat',price:0,tags:[]},{id:'bow',icon:'🎀',name:'Bow',price:0,tags:['cute','party']},{id:'cap',icon:'🧢',name:'Cap',price:0,tags:['sporty','beach']},
 {id:'flower',icon:'🌸',name:'Flower',price:10,tags:['garden','cute']},{id:'snowclip',icon:'❄️',name:'Snow clip',price:15,tags:['winter']},{id:'sunhat',icon:'👒',name:'Sun hat',price:15,tags:['beach','garden']},{id:'grad',icon:'🎓',name:'Smart cap',price:20,tags:['school']},
 {id:'tophat',icon:'🎩',name:'Top hat',price:25,tags:['fancy','party']},{id:'star',icon:'🌟',name:'Star clip',price:30,tags:['space','party']},{id:'crown',icon:'👑',name:'Crown',price:40,tags:['royal','fancy']}
];
// cover:true means it is long enough that no bottoms show
const TOPS=[
 {id:'tee',name:'T-shirt',price:0,tags:['sporty','school','beach']},{id:'dress',name:'Dress',price:0,tags:['cute','party','garden'],cover:true},
 {id:'tank',name:'Tank top',price:10,tags:['beach','sporty']},{id:'hoodie',name:'Hoodie',price:10,tags:['sporty','winter','school']},
 {id:'jacket',name:'Jacket',price:20,tags:['fancy','winter','space']},{id:'tutu',name:'Tutu',price:25,tags:['cute','party','royal'],cover:true},
 {id:'gown',name:'Ball gown',price:35,tags:['royal','fancy'],cover:true},{id:'spacesuit',name:'Space suit',price:35,tags:['space','winter'],cover:true}
];
const BOTTOMS=[{id:'pants',name:'Pants',price:0,tags:['school','winter','fancy']},{id:'shorts',name:'Shorts',price:0,tags:['beach','sporty']},{id:'skirt',name:'Skirt',price:10,tags:['cute','party','garden']}];
const SHOES=[{id:'sneakers',name:'Sneakers',price:0,tags:['sporty','school']},{id:'sandals',name:'Sandals',price:10,tags:['beach','garden']},{id:'boots',name:'Boots',price:15,tags:['winter','space']},{id:'fancy',name:'Fancy shoes',price:20,tags:['fancy','royal','party']}];
const ACCS=[
 {id:'none',icon:'',name:'Nothing',price:0,tags:[]},{id:'balloon',icon:'🎈',name:'Balloon',price:0,tags:['party','cute']},{id:'ball',icon:'⚽',name:'Ball',price:10,tags:['sporty']},
 {id:'books',icon:'📚',name:'Books',price:10,tags:['school']},{id:'glasses',icon:'🕶️',name:'Sunglasses',price:10,tags:['beach','space']},{id:'bag',icon:'👜',name:'Handbag',price:15,tags:['fancy','party']},
 {id:'scarf',icon:'🧣',name:'Scarf',price:15,tags:['winter']},{id:'umbrella',icon:'🌂',name:'Umbrella',price:15,tags:['garden','fancy']},{id:'rocket',icon:'🚀',name:'Toy rocket',price:20,tags:['space']},{id:'wand',icon:'🪄',name:'Magic wand',price:25,tags:['royal','party']}
];
const COLORS=[
 {id:'pink',hex:'#ff8cc6',name:'Pink',price:0,tags:['cute']},{id:'red',hex:'#ef4b5b',name:'Red',price:0,tags:['party','sporty']},{id:'blue',hex:'#4f9cf0',name:'Blue',price:0,tags:['beach','school','winter']},
 {id:'yellow',hex:'#ffd447',name:'Yellow',price:0,tags:['beach','garden']},{id:'green',hex:'#55c46a',name:'Green',price:0,tags:['garden','sporty']},{id:'white',hex:'#fbfbfb',name:'White',price:0,tags:['winter','fancy']},
 {id:'purple',hex:'#9b6cf0',name:'Purple',price:10,tags:['royal','space']},{id:'orange',hex:'#ff9a3c',name:'Orange',price:10,tags:['beach','party']},{id:'black',hex:'#2f2d38',name:'Black',price:15,tags:['fancy','space']},
 {id:'mint',hex:'#7fe0c4',name:'Mint',price:15,tags:['garden','cute']},{id:'sky',hex:'#9fd8ff',name:'Sky',price:15,tags:['winter','cute']},{id:'gold',hex:'#f2bd2c',name:'Gold',price:30,tags:['royal','fancy','party']}
];
const PATTERNS=[
 {id:'plain',name:'Plain',glyph:'',price:0,tags:[]},{id:'dots',name:'Dots',glyph:'●',price:0,tags:['cute','party']},{id:'stripes',name:'Stripes',glyph:'',price:10,tags:['sporty','beach','school']},
 {id:'hearts',name:'Hearts',glyph:'♥',price:15,tags:['cute']},{id:'flowers',name:'Flowers',glyph:'✿',price:15,tags:['garden']},{id:'stars',name:'Stars',glyph:'★',price:20,tags:['space','party']},
 {id:'snow',name:'Snowflakes',glyph:'❄',price:20,tags:['winter']},{id:'sparkle',name:'Sparkles',glyph:'✦',price:30,tags:['royal','fancy','party']}
];
const THEMES=[
 {id:'royal',icon:'👑',name:'Royal Ball',tags:['royal','fancy']},{id:'beach',icon:'🏖️',name:'Beach Day',tags:['beach']},{id:'garden',icon:'🌷',name:'Garden Party',tags:['garden','cute']},
 {id:'space',icon:'🚀',name:'Space Explorer',tags:['space']},{id:'snow',icon:'⛄',name:'Snow Day',tags:['winter']},{id:'sports',icon:'🏅',name:'Sports Day',tags:['sporty']},
 {id:'birthday',icon:'🎂',name:'Birthday Party',tags:['party','cute']},{id:'school',icon:'🏫',name:'First Day of School',tags:['school']},{id:'dinner',icon:'🍝',name:'Fancy Dinner',tags:['fancy']}
];
const TAG_WORDS={royal:'royal things',fancy:'fancy things',beach:'beach things',garden:'garden things',cute:'cute things',space:'space things',winter:'warm winter things',sporty:'sporty things',party:'party things',school:'school things'};
const JUDGES=[{face:'🦉',name:'Judge Hoot',likes:'the theme'},{face:'🦄',name:'Judge Sparkle',likes:'colors'},{face:'🐸',name:'Judge Hopper',likes:'style'}];
// color pairs that look nice together (any color also matches itself)
const GOES=[['pink','purple'],['pink','white'],['blue','white'],['black','white'],['yellow','blue'],['red','white'],['green','yellow'],['gold','black'],['gold','purple'],['orange','blue'],['mint','pink'],['sky','white'],['gold','white'],['red','black'],['purple','sky'],['mint','white'],['green','white'],['yellow','pink']];
const CATS={model:MODELS,hat:HATS,top:TOPS,bottom:BOTTOMS,shoes:SHOES,acc:ACCS,color:COLORS,pattern:PATTERNS};
const SAVE_KEY='superEmiliaStudio';

// ---------- pure game logic (also used by the tests) ----------
const find=(cat,id)=>CATS[cat].find(x=>x.id===id);
const key=(cat,id)=>cat+':'+id;
function owns(save,cat,id){const it=find(cat,id);return!!it&&(it.price===0||save.owned.includes(key(cat,id)))}
function goesWith(a,b){return a===b||GOES.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a))}
function defaultOutfit(){return{model:'kitty',hat:'bow',top:'dress',topColor:'pink',bottom:'pants',bottomColor:'blue',shoes:'sneakers',shoesColor:'white',acc:'balloon',pattern:'plain'}}
function defaultSave(){return{coins:15,owned:[],outfit:defaultOutfit(),theme:'birthday',best:{},shows:0,sound:true}}
// the parts of an outfit the judges look at (bottoms are hidden by long tops)
function parts(o){const top=find('top',o.top),list=[['hat',o.hat],['top',o.top],['shoes',o.shoes],['acc',o.acc],['color',o.topColor],['pattern',o.pattern]];if(!top.cover)list.push(['bottom',o.bottom],['color',o.bottomColor]);return list}
// which of the theme's liked parts the outfit has: [{cat,id,name}]
function themeMatches(o,theme){return parts(o).filter(([cat,id])=>find(cat,id).tags.some(t=>theme.tags.includes(t))).map(([cat,id])=>({cat,id,name:find(cat,id).name}))}
function clampScore(n){return Math.max(3,Math.min(10,Math.round(n)))}
// three judges, each 3-10. rand is for a tiny bit of judge mood
function scoreOutfit(o,theme,rand=Math.random){
 const top=find('top',o.top),slots=parts(o).filter(([cat,id])=>!(cat==='hat'&&id==='none')&&!(cat==='acc'&&id==='none')&&!(cat==='pattern'&&id==='plain')).length;
 const hits=themeMatches(o,theme).length,possible=top.cover?6:8;
 const t=clampScore(3+7*Math.min(1,hits/(possible-1))+(rand()<.5?0:.4));
 let c=4;const other=top.cover?o.shoesColor:o.bottomColor;if(goesWith(o.topColor,other))c+=3;if(goesWith(o.topColor,o.shoesColor)||goesWith(other,o.shoesColor))c+=1;if(o.pattern!=='plain')c+=1;if(COLORS.find(x=>x.id===o.topColor).tags.some(x=>theme.tags.includes(x)))c+=1;c+=rand()<.5?0:.5;
 let s=3+Math.min(slots,7)*0.7;if(o.hat!=='none')s+=.6;if(o.acc!=='none')s+=.6;if(o.model!=='kitty'||o.pattern!=='plain')s+=.4;s+=rand()<.5?0:.4;
 return[t,clampScore(c),clampScore(s)]}
function starsFor(total){return total>=25?3:total>=19?2:1}
function coinsFor(total,stars){return total+(stars===3?10:stars===2?4:0)}
// applies a finished show to the save; returns what changed
function recordShow(save,themeId,scores){const total=scores.reduce((a,b)=>a+b,0),stars=starsFor(total),coins=coinsFor(total,stars),better=stars>(save.best[themeId]||0);save.coins+=coins;save.shows++;if(better)save.best[themeId]=stars;return{total,stars,coins,better}}
function buy(save,cat,id){const it=find(cat,id);if(!it||owns(save,cat,id)||save.coins<it.price)return false;save.coins-=it.price;save.owned.push(key(cat,id));return true}
function nextTheme(current,rand=Math.random){const others=THEMES.filter(t=>t.id!==current);return others[Math.floor(rand()*others.length)].id}
function normalizeSave(raw){const s=defaultSave();if(!raw||typeof raw!=='object')return s;
 const n=Math.floor(Number(raw.coins));if(Number.isFinite(n)&&n>=0)s.coins=n;const sh=Math.floor(Number(raw.shows));if(Number.isFinite(sh)&&sh>=0)s.shows=sh;
 if(Array.isArray(raw.owned))s.owned=[...new Set(raw.owned.filter(k=>typeof k==='string'&&k.includes(':')&&CATS[k.split(':')[0]]&&find(k.split(':')[0],k.split(':')[1])))];
 if(THEMES.some(t=>t.id===raw.theme))s.theme=raw.theme;
 if(raw.best&&typeof raw.best==='object')for(const t of THEMES){const b=Math.floor(Number(raw.best[t.id]));if(b>=1&&b<=3)s.best[t.id]=b}
 if(raw.outfit&&typeof raw.outfit==='object'){const o=raw.outfit,slot={model:'model',hat:'hat',top:'top',bottom:'bottom',shoes:'shoes',acc:'acc',topColor:'color',bottomColor:'color',shoesColor:'color',pattern:'pattern'};for(const [k,cat] of Object.entries(slot))if(typeof o[k]==='string'&&owns(s,cat,o[k]))s.outfit[k]=o[k]}
 s.sound=raw.sound!==false;return s}
function loadSave(){try{return normalizeSave(JSON.parse(localStorage.getItem(SAVE_KEY)||'null'))}catch(e){return defaultSave()}}
