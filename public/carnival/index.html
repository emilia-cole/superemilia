<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe3c2">
<meta name="author" content="Emilia">
<meta name="description" content="A buddy carnival with ring toss, whack-a-mole, balloon pop, a duck pond, and a ferris wheel. Win tickets and trade them for prizes. A free game by Emilia.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Super Emilia">
<meta property="og:url" content="https://superemilia.com/carnival/">
<meta property="og:title" content="Buddy Carnival · A Super Emilia Game">
<meta property="og:description" content="A buddy carnival with ring toss, whack-a-mole, balloon pop, a duck pond, and a ferris wheel. Win tickets and trade them for prizes. A free game by Emilia.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<title>Buddy Carnival</title>
<style>
/* Layout: two screens. The midway (a row of striped booth tents, the prize shelf) and a game screen (a stage where each mini-game is played). Results and the prize booth open in dialogs. */
:root{
 color-scheme:light;
 --sky:#ffe3c2; --sky-2:#ffd1e6; --paper:#fffaf3; --line:#f0d6bd; --ink:#3d2730; --soft:#86656f;
 --red:#ff5a6e; --red-deep:#d63a50; --yellow:#ffcf4d; --blue:#5aa9ff; --green:#4cc38a;
 --round:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky),var(--sky-2));color:var(--ink);font-family:var(--round);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 12px;font-weight:800;transition:transform .1s ease}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--red-deep);outline-offset:2px}
.app{max-width:980px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px 18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.home{text-decoration:none;font-weight:800;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14px}
.title{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.title small{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--red-deep);font-weight:800}
.title strong{font-size:20px;letter-spacing:-.4px}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.tix{color:#b0303f;border-color:#ffc0c8;background:#fff0f2}
h1{margin:0;font-size:clamp(24px,5vw,34px);letter-spacing:-.6px}
.lede{margin:2px 0 0;color:var(--soft);font-weight:600}
/* the midway */
.booths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.booth{position:relative;display:grid;justify-items:center;gap:4px;padding:0 0 12px;border-radius:20px;overflow:hidden;background:var(--paper);box-shadow:0 5px 0 var(--line);text-align:center}
.booth .tent{width:100%;height:30px;background:repeating-linear-gradient(90deg,var(--c1,#ff5a6e) 0 22px,#fff 22px 44px);clip-path:polygon(0 0,100% 0,100% 70%,96% 100%,92% 70%,88% 100%,84% 70%,80% 100%,76% 70%,72% 100%,68% 70%,64% 100%,60% 70%,56% 100%,52% 70%,48% 100%,44% 70%,40% 100%,36% 70%,32% 100%,28% 70%,24% 100%,20% 70%,16% 100%,12% 70%,8% 100%,4% 70%,0 100%)}
.booth .bi{font-size:46px;line-height:1.1;margin-top:6px}
.booth .bn{font-weight:900;font-size:17px}
.booth .bd{font-size:12.5px;color:var(--soft);font-weight:700;padding:0 8px;line-height:1.3}
.booth .bb{font-size:12px;font-weight:900;color:#b0303f}
.booth.prize{--c1:#ffcf4d}
.shelfbox{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:12px}
.shelfbox h2{margin:0 0 8px;font-size:18px}
.myprizes{display:flex;flex-wrap:wrap;gap:6px;font-size:34px;min-height:44px;align-items:center;border-bottom:8px solid #c98e5c;padding-bottom:6px}
.myprizes .none{font-size:14px;color:var(--soft);font-weight:700}
/* game screen */
.gamehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gamehead h1{font-size:24px;margin-right:auto}
.stage{position:relative;aspect-ratio:16/10;border-radius:24px;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 0 #e8b9a2;container-type:inline-size;touch-action:none;background:linear-gradient(180deg,#8fd0ff 0 55%,#7fcf6a 55%)}
.o{position:absolute;transform:translate(-50%,-50%);line-height:1;-webkit-user-select:none;user-select:none;pointer-events:none}
.hud{position:absolute;left:2cqw;top:2cqw;display:flex;gap:1.4cqw;z-index:10}
.hud span{background:#fffe;border-radius:99px;padding:.8cqw 1.8cqw;font-weight:900;font-size:2.6cqw;color:var(--ink);box-shadow:0 .4cqw 0 #0002}
.say{position:absolute;left:50%;top:13%;transform:translateX(-50%);background:#fffe;border-radius:2cqw;padding:1cqw 2.4cqw;font-weight:900;font-size:2.8cqw;z-index:10;white-space:nowrap;box-shadow:0 .4cqw 0 #0002}
/* ring toss */
.counter{background:linear-gradient(180deg,#c98e5c,#a86e3d);box-shadow:0 1cqw 0 #7a4c26}
.bottle{font-size:7cqw}
.ring{width:9cqw;height:4cqw;border-radius:50%;border:1.4cqw solid var(--rc,#ff5a6e);box-shadow:0 .4cqw 0 #0003}
.ringhint{font-size:2.6cqw;font-weight:900;color:#fff;text-shadow:0 .3cqw 0 #0005}
/* whack-a-mole */
.hole{width:15cqw;height:5cqw;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#3a2516,#5a3a20 70%);box-shadow:0 .6cqw 0 #3a7a2e}
.mole{font-size:9cqw;pointer-events:auto;cursor:pointer;transition:transform .12s ease}
.mole.down{transform:translate(-50%,-10%) scale(.2);opacity:0}
.bonk{font-size:5cqw;animation:pop .4s ease forwards}
/* balloons */
.balloon{font-size:8cqw;pointer-events:auto;cursor:pointer;filter:hue-rotate(var(--h,0deg))}
.balloon.special{filter:drop-shadow(0 0 1.4cqw #ffcf4d)}
/* can knockdown */
.can{font-size:7cqw;transition:transform .5s ease,opacity .5s ease}
.can.down{transform:translate(-50%,40%) rotate(80deg);opacity:.25}
.ball{font-size:6cqw;pointer-events:auto;cursor:grab}
.aim{position:absolute;width:5cqw;height:5cqw;border-radius:50%;border:.5cqw dashed #ff5a6e;transform:translate(-50%,-50%);pointer-events:none}
/* popcorn */
.bucket{font-size:9cqw}
.kernel{font-size:4.5cqw}
/* high striker */
.tower{background:linear-gradient(90deg,#ff5a6e 0 30%,#fff 30% 70%,#ff5a6e 70%);border-radius:1cqw;box-shadow:0 .6cqw 0 #0002}
.puck{width:5cqw;height:3cqw;border-radius:1cqw;background:#ffcf4d;border:.4cqw solid #c9952b;transition:top .5s cubic-bezier(.2,.9,.3,1)}
.bell{font-size:8cqw}
.bell.ring{animation:shake .15s linear 6}
.power{position:absolute;transform:translate(-50%,-50%);width:6cqw;border-radius:2cqw;background:linear-gradient(0deg,#4cc38a,#ffcf4d 60%,#ff5a6e 88%);border:.5cqw solid #fff;overflow:hidden}
.power i{position:absolute;left:-1cqw;right:-1cqw;height:1cqw;background:#3d2730;border-radius:1cqw}
.hammer{font-size:9cqw;transform-origin:80% 80%;transition:transform .15s}
.hammer.swing{transform:translate(-50%,-50%) rotate(-70deg)}
@keyframes shake{0%{rotate:-12deg}50%{rotate:12deg}100%{rotate:-12deg}}
/* carousel */
.top{border-radius:50% 50% 8% 8%/90% 90% 10% 10%;background:repeating-linear-gradient(90deg,#ff5a6e 0 5cqw,#fff 5cqw 10cqw);box-shadow:0 1cqw 0 #0002}
.base{border-radius:50%;background:radial-gradient(ellipse,#ffe08a,#e8b62f);box-shadow:0 1cqw 0 #b88a1c}
.horse{font-size:7cqw}
/* claw machine */
.glass{border:1.2cqw solid #5aa9ff;border-radius:2cqw;background:linear-gradient(180deg,#e6f6ff88,#bfe6ff88)}
.rail{background:#7a8ea8;border-radius:1cqw}
.claw{font-size:6cqw;display:grid;justify-items:center}
.claw .cable{width:.5cqw;background:#555;}
.toy{font-size:6cqw}
.chute{background:#3d2730;border-radius:1cqw}
/* cotton candy */
.machine{border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#fff,#ffd1e6 60%,#ff8fc7);box-shadow:0 1cqw 0 #d65a9f,inset 0 0 0 1cqw #fff}
.fluff{border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,var(--fc,#ffb3e0) 60%);box-shadow:0 0 3cqw var(--fc,#ffb3e0);transition:width .2s,height .2s}
.stick{font-size:7cqw}
/* bumper cars */
.arena{border-radius:3cqw;background:repeating-linear-gradient(45deg,#4b4380 0 4cqw,#433b75 4cqw 8cqw);border:1.4cqw solid #ffcf4d}
.car{font-size:7cqw;transition:transform .05s}
.car.me{filter:drop-shadow(0 0 1.2cqw #ffcf4d)}
/* face painting */
.face{font-size:34cqw}
.paint{font-size:6cqw;pointer-events:auto;cursor:grab}
.sticker{font-size:5cqw;pointer-events:auto;cursor:grab}
.donebtn{pointer-events:auto;font-size:2.8cqw;font-weight:900;background:#ff5a6e;color:#fff;border:none;border-radius:2cqw;padding:1.2cqw 2.4cqw;box-shadow:0 .6cqw 0 #d63a50;cursor:pointer;font-family:inherit}
/* duck pond */
.pond{border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#9fe3ff,#4fa7d8);box-shadow:inset 0 0 0 1.4cqw #bfeaff,0 1cqw 0 #3a7a2e}
.duck{font-size:7cqw;pointer-events:auto;cursor:pointer}
.duck.flip{animation:flip .6s ease forwards}
.ducknum{font-size:5cqw;font-weight:900;color:#b0303f;background:#fff;border-radius:2cqw;padding:1cqw 2cqw}
/* ferris wheel */
.wheel{width:52cqw;height:52cqw;border-radius:50%;border:1.2cqw solid #ff5a6e;background:repeating-conic-gradient(from 0deg,#fff 0 2deg,transparent 2deg 45deg);transform:translate(-50%,-50%) rotate(var(--r,0deg))}
.cart{font-size:5cqw;background:var(--cc,#ffcf4d);border-radius:1.4cqw;padding:.4cqw .8cqw;box-shadow:0 .4cqw 0 #0003}
.stand{width:4cqw;background:#c96b5a;transform-origin:top center}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(-50%,-120%) scale(1.3);opacity:0}}
@keyframes flip{0%{transform:translate(-50%,-50%) rotateY(0)}100%{transform:translate(-50%,-50%) rotateY(180deg)}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-200%) scale(1.1)}}
.fx{animation:rise 1s ease-out forwards;font-size:4cqw}
/* dialogs */
dialog{border:none;border-radius:26px;padding:0;background:var(--paper);color:var(--ink);width:min(520px,calc(100vw - 20px));max-height:calc(100dvh - 24px);box-shadow:0 30px 80px #3d273055}
dialog::backdrop{background:#3d273066;backdrop-filter:blur(4px)}
.dlg{padding:18px 16px 16px;display:grid;gap:12px}
.dlg.center{justify-items:center;text-align:center}
.dlg header{display:flex;align-items:center;gap:8px}
.dlg h2{margin:0;font-size:24px;letter-spacing:-.4px}
.dlg header h2{margin-right:auto}
.dlg p{margin:0;color:var(--soft);font-weight:600;line-height:1.45}
.dlg .big{font-size:60px;line-height:1}
.tickets{font-size:30px;font-weight:900;color:#b0303f}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.primary{background:var(--red);border-color:var(--red-deep);color:#fff;box-shadow:0 4px 0 var(--red-deep);font-size:17px;padding:11px 20px}
.prizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:min(60dvh,480px);overflow:auto;padding:2px}
.pz{display:grid;justify-items:center;gap:3px;padding:10px 4px;border-radius:16px;border:2px solid var(--line);background:#fff;text-align:center}
.pz .pi{font-size:36px;line-height:1.1}
.pz .pn{font-size:12.5px;font-weight:900}
.pz button{padding:5px 10px;font-size:13px}
.pz.own{background:#effcf5;border-color:#bfe8d4}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100vw - 30px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
@media (max-width:640px){.booths{grid-template-columns:repeat(2,minmax(0,1fr))}.title strong{font-size:17px}.stage{aspect-ratio:4/3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <div class="topbar">
  <a class="home" href="/" aria-label="Back to all games">← Games</a>
  <div class="title"><small>Super Emilia</small><strong>Buddy Carnival</strong></div>
  <span class="chip" id="ducks" aria-label="Duck tokens">🦆 0</span>
  <span class="chip tix" id="tix" aria-label="Tickets">🎟️ 0</span>
  <button type="button" id="soundBtn" aria-pressed="true">🔊</button>
 </div>
 <section id="midway" style="display:grid;gap:12px">
  <div><h1>🎪 Welcome to the carnival!</h1><p class="lede">Play games to win 🎟️ tickets, then trade them for prizes. Every game you finish also gives you a 🦆 duck token for the Duck Pond.</p></div>
  <div class="booths" id="booths"></div>
  <div class="shelfbox"><h2>🏆 My prizes</h2><div class="myprizes" id="myPrizes"></div></div>
 </section>
 <section id="game" hidden style="display:grid;gap:10px">
  <div class="gamehead"><h1 id="gameTitle">Ring Toss</h1><button type="button" id="leaveBtn">← Back to the carnival</button></div>
  <div class="stage" id="stage" aria-live="polite"></div>
  <p class="lede" id="gameHelp" style="text-align:center"></p>
 </section>
</div>

<dialog id="resultDialog" aria-labelledby="resultTitle"><div class="dlg center">
 <div class="big" id="resultBig" aria-hidden="true">🎉</div>
 <h2 id="resultTitle">Great job!</h2>
 <div class="tickets" id="resultTix">+0 🎟️</div>
 <p id="resultText"></p>
 <div class="row"><button type="button" id="againBtn">↻ Play again</button><button type="button" class="primary" id="midwayBtn">Back to the carnival</button></div>
</div></dialog>
<dialog id="prizeDialog" aria-labelledby="prizeTitle"><div class="dlg">
 <header><h2 id="prizeTitle">🎁 Prize booth</h2><span class="chip tix" id="prizeTix">🎟️ 0</span><button type="button" id="prizeClose" aria-label="Close the prize booth">✕</button></header>
 <div class="prizes" id="prizeList"></div>
</div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
// ---------- game data ----------
const GAMES=[
 {id:'ring',icon:'🎯',name:'Ring Toss',c1:'#ff5a6e',desc:'Aim and let go to toss rings over the bottles.',help:'Drag left and right to aim the ring, then let go to throw it! 5 rings.'},
 {id:'whack',icon:'🔨',name:'Whack-a-Mole',c1:'#5aa9ff',desc:'Bonk the buddies when they pop up!',help:'Tap the buddies when they pop out of the holes. Golden ones are worth 3!'},
 {id:'balloon',icon:'🎈',name:'Balloon Pop',c1:'#4cc38a',desc:'Pop the balloons before they float away.',help:'Tap the balloons to pop them. Sparkly ones are worth 3!'},
 {id:'cans',icon:'🥫',name:'Can Knockdown',c1:'#ff9a3c',desc:'Throw balls to knock down the tower of cans.',help:'Drag the ball and let go where you want to throw it! 3 balls.'},
 {id:'popcorn',icon:'🍿',name:'Popcorn Catch',c1:'#ff8fc7',desc:'Slide the bucket to catch falling popcorn.',help:'Drag left and right to move the bucket. Candy is worth 3!'},
 {id:'striker',icon:'🔔',name:'High Striker',c1:'#7fe0c4',desc:'Swing the hammer to ring the bell!',help:'Tap when the power meter is near the top to ring the bell. 3 swings.'},
 {id:'claw',icon:'🧸',name:'Claw Machine',c1:'#5aa9ff',desc:'Drop the claw to grab a prize.',help:'Drag left and right to move the claw, then let go to drop it! 3 tries.'},
 {id:'cotton',icon:'🍭',name:'Cotton Candy',c1:'#ff8fc7',desc:'Swirl the stick to make cotton candy.',help:'Drag the stick around and around the machine to make it big and fluffy! 15 seconds.'},
 {id:'bumper',icon:'🚗',name:'Bumper Cars',c1:'#ff9a3c',desc:'Drive your car and bump the others!',help:'Hold down and move the mouse (or your finger). Your car drives toward it. Bump the other cars!'},
 {id:'face',icon:'🎨',name:'Face Painting',c1:'#b48cff',desc:'Paint a buddy face with stars and hearts.',help:'Drag the paint pictures onto the face, then tap All done!'},
 {id:'duck',icon:'🦆',name:'Duck Pond',c1:'#ffcf4d',desc:'Pick a duck to win a surprise prize. Uses 1 duck token.',help:'Tap any duck to see how many tickets it has on the bottom!'},
 {id:'wheel',icon:'🎡',name:'Ferris Wheel',c1:'#b48cff',desc:'Take a relaxing ride to the very top.',help:'Sit back and enjoy the ride!'},
 {id:'carousel',icon:'🎠',name:'Carousel',c1:'#ffcf4d',desc:'Ride the merry-go-round with your buddies.',help:'Wheee! Enjoy the music and the ride.'}
];
const PRIZES=[['balloon','🎈','Balloon',5],['bow','🎀','Big bow',6],['popcorn','🍿','Popcorn bucket',7],['lolly','🍭','Giant lollipop',8],['cupcake','🧁','Cupcake',9],['teddy','🧸','Teddy bear',10],['yoyo','🪀','Yo-yo',12],['paint','🎨','Paint set',14],['puppy','🐶','Plush puppy',15],['skates','🛼','Roller skates',18],['kite','🪁','Kite',20],['panda','🐼','Panda plush',22],['hat','🎩','Magic hat',25],['giraffe','🦒','Giraffe plush',28],['robot','🤖','Toy robot',30],['rocket','🚀','Toy rocket',35],['shark','🦈','Shark plush',38],['unicorn','🦄','Unicorn plush',40],['octopus','🐙','Octopus plush',45],['dragon','🐉','Dragon plush',50],['crown','👑','Royal crown',60],['minicarousel','🎠','Mini carousel',70],['trophy','🏆','Golden trophy',100],['diamond','💎','Giant diamond',150],['frog','🐸','Frog plush',13],['sunglasses','🕶️','Cool sunglasses',11],['drum','🥁','Toy drum',16],['penguin','🐧','Penguin plush',19],['guitar','🎸','Toy guitar',24],['wand','🪄','Magic wand',32],['dino','🦖','Dino plush',42],['whale','🐳','Whale plush',48],['castle','🏰','Toy castle',55],['telescope','🔭','Telescope',65],['train','🚂','Train set',80],['rainbowstar','🌟','Rainbow star',120]].sort((a,b)=>a[3]-b[3]).map(([id,icon,name,price])=>({id,icon,name,price}));
const SAVE_KEY='superEmiliaCarnival';
const RING_HIT=5.5; // how close (in % of the stage width) the ring must land to a bottle

// ---------- pure game logic (also used by the tests) ----------
// tickets won for a score in each game
const SCORED=['ring','whack','balloon','cans','popcorn','striker','claw','cotton','bumper'],RIDES=['wheel','carousel'];
function ticketsFor(game,score){if(game==='ring')return score*3+(score>=5?5:0);if(game==='cans')return score*2+(score>=6?6:0);if(game==='whack'||game==='balloon'||game==='popcorn')return Math.floor(score/2);if(game==='duck'||game==='striker'||game==='claw')return score;if(game==='cotton')return Math.min(score,20);if(game==='bumper')return Math.floor(score*0.8);if(game==='face')return 4;return 0}
// claw machine: the claw grabs the prize closest to it, if it is close enough
const CLAW_REACH=5;
function clawGrab(x,toys){let best=-1,d=CLAW_REACH;toys.forEach((t,i)=>{if(t.gone)return;const dd=Math.abs(t.x-x);if(dd<=d){d=dd;best=i}});return best}
// can knockdown: 6 cans in a tower. A ball knocks over cans near where it lands, and cans fall when a can under them falls.
const CANS=[{x:42,y:57,r:0},{x:50,y:57,r:0},{x:58,y:57,r:0},{x:46,y:45,r:1,on:[0,1]},{x:54,y:45,r:1,on:[1,2]},{x:50,y:33,r:2,on:[3,4]}];
function knockCans(down,hx,hy){const out=down.slice();CANS.forEach((c,i)=>{if(!out[i]&&Math.abs(c.x-hx)<=6.5&&Math.abs(c.y-hy)<=8)out[i]=true});let moved=true;while(moved){moved=false;CANS.forEach((c,i)=>{if(!out[i]&&c.on&&c.on.some(j=>out[j])){out[i]=true;moved=true}})}return out}
// high striker: how hard the swing was (0 to 100) gives points; 90 or more rings the bell
function strikerPoints(power){return power>=90?5:power>=75?3:power>=50?2:1}
// where the bottles are at time t: they slide left and right together
function bottleXs(t,level=1){const off=10*Math.sin(t*(0.45+0.1*level));return[22,36,50,64,78].map(x=>x+off)}
// which bottle a ring lands on (index), or -1 for a miss

 G.step=dt=>{if(!busy){power=50+50*Math.sin(G.t*2.6);needle.style.bottom=power+'%'}hud(['Swings: '+swings,'Points: '+G.score])};say('Tap when the meter is high! 💪')}

// ----- Carousel: a fun ride -----
function startCarousel(){const st=stage();st.style.background='linear-gradient(180deg,#b9a6ff,#ffd1e6 60%,#7fcf6a 60%)';
 o('top',50,22,'',64,16);o('base',50,74,'',70,14);const poles=[];const horses=['🐎','🦄','🐎','🦄','🐎','🦄'].map((h,i)=>{const pole=o('',50,50,'',null,null);pole.style.cssText+='width:.6cqw;height:40%;background:#ffcf4d';poles.push(pole);return o('horse',50,50,h)});
 const riders=['🐱','🐶','🐰','🐻','🐼','🦊'].map(r=>o('',50,50,r));riders.forEach(r=>r.style.fontSize='4cqw');
 G.step=dt=>{horses.forEach((h,i)=>{const a=G.t*1.1+i*Math.PI/3,x=50+30*Math.cos(a),depth=Math.sin(a),y=60+6*depth+Math.sin(G.t*4+i)*3;h.style.left=x+'%';h.style.top=y+'%';h.style.zIndex=Math.round(depth*10)+20;h.style.transform='translate(-50%,-50%) scaleX('+(Math.cos(a+Math.PI/2)>0?-1:1)+') scale('+(0.8+0.25*(depth+1)/2)+')';poles[i].style.left=x+'%';poles[i].style.top=(y-14)+'%';poles[i].style.zIndex=h.style.zIndex-1;riders[i].style.left=x+'%';riders[i].style.top=(y-7)+'%';riders[i].style.zIndex=Number(h.style.zIndex)+1});
  if(Math.random()<dt*3)fx(20+Math.random()*60,30+Math.random()*20,['🎵','🎶'][Math.floor(Math.random()*2)]);if(Math.random()<dt*2)tone([523,587,659,784,880][Math.floor(Math.random()*5)],.18,'triangle',.03);if(G.t>12)end()};say('Round and round! 🎠')}

// ----- Claw machine: drag to move the claw, let go to drop it -----
function startClaw(){const st=stage();st.style.background='linear-gradient(180deg,#ffd1e6,#fff3e2)';o('glass',50,52,'',70,88);o('rail',50,14,'',66,2.5);o('chute',22,86,'',10,10);o('',22,76,'⬇').style.fontSize='4cqw';
 const VALUES={'🧸':5,'🐶':4,'🐰':4,'🦄':8,'🐼':5,'🦊':4,'🐸':3,'🐙':6,'🐲':10};const kinds=Object.keys(VALUES);
 const toys=[];for(let i=0;i<8;i++){const x=33+i*6.6,e=kinds[Math.floor(Math.random()*kinds.length)];toys.push({x,y:82-(i%2)*6,e,el:o('toy',x,82-(i%2)*6,e),gone:false})}
 let cx=50,tries=3,phase='move',cy=20,held=-1,holding=false;const claw=o('claw',cx,cy,'<span class="cable" style="height:0"></span><span>🦾</span>');claw.style.transform='translate(-50%,-50%) rotate(180deg)';
 st.onpointerdown=e=>{if(phase!=='move'||tries<=0)return;holding=true;st.setPointerCapture(e.pointerId);cx=Math.max(30,Math.min(82,pct(e).x))};
 st.onpointermove=e=>{if(!holding||phase!=='move')return;cx=Math.max(30,Math.min(82,pct(e).x))};
 st.onpointerup=()=>{if(!holding)return;holding=false;if(phase==='move'){phase='down';sfx.whoosh()}};
 G.step=dt=>{claw.style.left=cx+'%';
  if(phase==='down'){cy+=55*dt;if(cy>=72){cy=72;held=clawGrab(cx,toys);if(held>=0){sfx.hit();say('Got one! '+toys[held].e)}else{sfx.miss();say('Missed! So close.')}phase='up'}}
  else if(phase==='up'){cy-=45*dt;if(held>=0){toys[held].el.style.left=cx+'%';toys[held].el.style.top=(cy+8)+'%'}if(cy<=20){cy=20;phase=held>=0?'carry':'reset'}}
  else if(phase==='carry'){cx-=40*dt;toys[held].el.style.left=cx+'%';if(cx<=22){cx=22;const t=toys[held];t.gone=true;G.score+=VALUES[t.e];fx(22,70,'+'+VALUES[t.e]+' 🎟️');sfx.coin();t.el.remove();held=-1;phase='reset'}}
  else if(phase==='reset'){tries--;phase=tries>0?'move':'done';if(tries<=0)setTimeout(end,700);cx=Math.max(30,cx)}
  claw.style.top=cy+'%';hud(['Tries: '+Math.max(0,tries),'Tickets: '+G.score])};say('Grab a prize! 🧸')}

// ----- Cotton candy: swirl the stick around the machine -----
function startCotton(){const st=stage();st.style.background='linear-gradient(180deg,#ffe6f3,#fff3e2)';const C={x:50,y:58};o('machine',C.x,C.y+8,'',48,46);
 const colors=['#ffb3e0','#b3d9ff','#c9f2c7','#fff0a8','#e0c9ff'],col=colors[Math.floor(Math.random()*colors.length)];const fluff=o('fluff',C.x,C.y-4,'',4,6);fluff.style.setProperty('--fc',col);const stick=o('stick',C.x+20,C.y-10,'🥢');
 let turn=0,lastA=null,holding=false;
 st.onpointerdown=e=>{holding=true;st.setPointerCapture(e.pointerId);lastA=null};st.onpointerup=()=>{holding=false;lastA=null};
 st.onpointermove=e=>{if(!holding||G.over)return;const p=pct(e);stick.style.left=p.x+'%';stick.style.top=p.y+'%';const a=Math.atan2((p.y-C.y)*0.625,p.x-C.x);if(lastA!==null){let d=a-lastA;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;turn+=Math.abs(d);const n=Math.floor(turn/(2*Math.PI));if(n>G.score){G.score=n;tone(500+n*30,.08,'triangle',.04);fx(C.x+(Math.random()-.5)*20,C.y-15,'✨')}}lastA=a};
 G.step=dt=>{const left=Math.max(0,15-G.t),size=4+Math.min(G.score,20)*1.6;fluff.style.width=size+'%';fluff.style.height=(size*1.6)+'%';fluff.style.top=(C.y-4-size*.4)+'%';hud(['⏱️ '+Math.ceil(left),'Swirls: '+G.score]);if(left<=0)end()};say('Swirl the stick round and round! 🍭')}

// ----- Bumper cars: drive toward the pointer and bump the other cars -----
function startBumper(){const st=stage();st.style.background='#2a1f4d';o('arena',50,52,'',94,88);
 const me={x:50,y:75,vx:0,vy:0,el:o('car me',50,75,'🚗')};const others=['🚙','🚕','🏎️','🚓'].map((c,i)=>({x:20+i*20,y:30+(i%2)*12,vx:(i%2?-1:1)*(16+i*3),vy:(i%2?1:-1)*12,el:o('car',20+i*20,30,c),cool:0}));
 let target=null;st.onpointerdown=e=>{st.setPointerCapture(e.pointerId);target=pct(e)};st.onpointermove=e=>{if(target||e.buttons)target=pct(e)};st.onpointerup=()=>{target=null};
 const wall=c=>{if(c.x<9){c.x=9;c.vx=Math.abs(c.vx)}if(c.x>91){c.x=91;c.vx=-Math.abs(c.vx)}if(c.y<14){c.y=14;c.vy=Math.abs(c.vy)}if(c.y>90){c.y=90;c.vy=-Math.abs(c.vy)}};
 G.step=dt=>{const left=Math.max(0,25-G.t);if(target){const dx=target.x-me.x,dy=(target.y-me.y)/0.625,d=Math.hypot(dx,dy)||1;me.vx+=(dx/d*40-me.vx)*Math.min(1,dt*4);me.vy+=(dy/d*40*0.625-me.vy)*Math.min(1,dt*4)}else{me.vx*=.96;me.vy*=.96}
  me.x+=me.vx*dt;me.y+=me.vy*dt;wall(me);
  for(const c of others){c.x+=c.vx*dt;c.y+=c.vy*dt;wall(c);c.cool=Math.max(0,c.cool-dt);if(c.cool<=0&&Math.abs(c.x-me.x)<7&&Math.abs(c.y-me.y)<10){c.cool=.6;G.score++;sfx.bonk();fx((c.x+me.x)/2,(c.y+me.y)/2-6,'💥');const sx=Math.sign(c.x-me.x)||1,sy=Math.sign(c.y-me.y)||1;c.vx=sx*Math.abs(c.vx||18);c.vy=sy*Math.abs(c.vy||12);me.vx=-sx*20;me.vy=-sy*14}
   c.el.style.left=c.x+'%';c.el.style.top=c.y+'%';c.el.style.transform='translate(-50%,-50%) scaleX('+(c.vx<0?1:-1)+')'}
  me.el.style.left=me.x+'%';me.el.style.top=me.y+'%';me.el.style.transform='translate(-50%,-50%) scaleX('+(me.vx<0?1:-1)+')';
  hud(['⏱️ '+Math.ceil(left),'Bumps: '+G.score]);if(left<=0)end()};say('Bump bump! 🚗💥')}

// ----- Face painting: drag paint pictures onto the face -----
function startFace(){const st=stage();st.style.background='linear-gradient(180deg,#fff3e2,#ffe0ee)';const faces=['🐱','🐶','🐰','🐻','🐼','🐯'];o('face',38,52,faces[Math.floor(Math.random()*faces.length)]);
 const PAINTS=['⭐','❤️','🦋','🌈','🌸','✨','🌙','🐾','💜','🍀'];let placed=0;
 PAINTS.forEach((ch,i)=>{const x=78+(i%2)*10,y=16+Math.floor(i/2)*16,pnt=o('paint',x,y,ch);pnt.setAttribute('role','button');pnt.setAttribute('aria-label','Paint '+ch);
  pnt.onpointerdown=e=>{e.stopPropagation();e.preventDefault();const stk=o('sticker',x,y,ch);stk.setPointerCapture(e.pointerId);sfx.pop();
   const mv=ev=>{const p=pct(ev);stk.style.left=p.x+'%';stk.style.top=p.y+'%'};stk.onpointermove=mv;stk.onpointerup=ev=>{const p=pct(ev);stk.onpointermove=null;stk.onpointerup=null;if(Math.abs(p.x-38)<20&&Math.abs(p.y-52)<34){placed++;tone(700+placed*40,.08,'triangle',.04);fx(p.x,p.y,'✨');
     stk.onpointerdown=e2=>{e2.stopPropagation();stk.setPointerCapture(e2.pointerId);stk.onpointermove=mv;stk.onpointerup=ev2=>{stk.onpointermove=null;const q=pct(ev2);if(!(Math.abs(q.x-38)<20&&Math.abs(q.y-52)<34)){stk.remove();placed=Math.max(0,placed-1)}}}}else stk.remove()}}});
 const btn=document.createElement('button');btn.type='button';btn.className='o donebtn';btn.style.left='38%';btn.style.top='93%';btn.textContent='All done! 🎨';btn.onclick=e=>{e.stopPropagation();if(!placed){say('Add some paint first!');return}G.score=placed;end()};st.append(btn);
 G.step=()=>hud(['Paint: '+placed]);say('Make the face fancy! 🎨')}

// ----- Prize booth -----
function openPrizes(){renderPrizes();$('#prizeDialog').showModal()}
function renderPrizes(){renderTop();const box=$('#prizeList');box.innerHTML='';for(const p of PRIZES){const own=S.prizes.includes(p.id),d=document.createElement('div');d.className='pz'+(own?' own':'');d.innerHTML='<span class="pi" aria-hidden="true"></span><span class="pn"></span>';d.firstChild.textContent=p.icon;d.children[1].textContent=p.name;const b=document.createElement('button');b.type='button';
 if(own){b.textContent='✓ Yours';b.disabled=true}else{b.textContent='🎟️ '+p.price;b.disabled=S.tickets<p.price;b.setAttribute('aria-label','Get the '+p.name+' for '+p.price+' tickets');b.onclick=()=>{if(buyPrize(S,p.id)){save();sfx.win();notify('You got the '+p.name+'! '+p.icon);renderPrizes();renderMidway()}}}d.append(b);box.append(d)}}
$('#prizeClose').onclick=()=>$('#prizeDialog').close();
$('#prizeDialog').addEventListener('click',e=>{if(e.target===$('#prizeDialog'))$('#prizeDialog').close()});
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();renderTop()};
renderMidway();
window.__carnival={get S(){return S},get G(){return G},start,goMidway};
}
