<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eafaf4">
<meta name="author" content="Emilia">
<meta name="description" content="Do hands-on science experiments: mix colors, make a volcano erupt, grow crystals, launch a bottle rocket, test magnets, and find out what sinks or floats. A free game by Emilia.">
<link rel="canonical" href="https://superemilia.com/lab/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Super Emilia">
<meta property="og:url" content="https://superemilia.com/lab/">
<meta property="og:title" content="Science Lab · A Super Emilia Game">
<meta property="og:description" content="Do hands-on science experiments: mix colors, make a volcano erupt, grow crystals, launch a bottle rocket, test magnets, and find out what sinks or floats. A free game by Emilia.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<title>Science Lab</title>
<style>
/* Layout: the lab home (six experiment cards) and an experiment screen (a tip line and one drawn scene with the tray of things to drag on the right). */
:root{
 color-scheme:light;
 --bg:#eafaf4; --bg-2:#eef1ff; --paper:#fff; --line:#cfe7dc; --ink:#21362e; --soft:#5f7a6e;
 --lab:#22a06b; --lab-deep:#147a50;
 --round:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(800px 400px at 85% 0,#fff 0,transparent 60%),linear-gradient(170deg,var(--bg),var(--bg-2));color:var(--ink);font-family:var(--round);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 12px;font-weight:800;transition:transform .1s ease}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--lab-deep);outline-offset:2px}
.app{max-width:1000px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px 18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.home{text-decoration:none;font-weight:800;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14px}
.title{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.title small{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--lab-deep);font-weight:800}
.title strong{font-size:20px;letter-spacing:-.4px}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:14px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.5px}
.hero p{margin:0;color:var(--soft);font-weight:600;line-height:1.45}
.exps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.exp{display:grid;gap:6px;justify-items:center;text-align:center;padding:16px 10px;border-radius:20px;border:3px solid var(--line);background:#fbfffd;box-shadow:0 5px 0 #0001}
.exp .big{font-size:46px;line-height:1}
.exp b{font-size:19px}
.exp small{color:var(--soft);font-weight:700;line-height:1.35}
.exp .prog{font-size:13px;font-weight:900;color:var(--lab-deep)}
.exp.badge{border-color:#f2c94c;background:#fffbea}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar h2{margin:0 auto 0 0;font-size:20px}
.tip{margin:0;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700;color:var(--soft);font-size:14.5px;min-height:42px;line-height:1.4}
.tip b{color:var(--ink)}
.scene{position:relative;aspect-ratio:16/10;border-radius:24px;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 0 #cfe2d8;background:linear-gradient(180deg,#f4fbff 0 72%,#cfd8e3 72% 74%,#e9eef4 74%);container-type:inline-size;touch-action:none}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.tray{position:absolute;left:76%;right:1.2%;top:2.5%;bottom:2.5%;background:#ffffffdd;border-radius:2cqw;box-shadow:0 .6cqw 0 #0001}
.p{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;line-height:1;-webkit-user-select:none;user-select:none}
.grab{cursor:grab;touch-action:none;z-index:10;filter:drop-shadow(0 .3cqw 0 #0002)}
.grab.drag{cursor:grabbing;z-index:40}
.grab.back{transition:left .3s ease,top .3s ease}
.emo{font-size:5cqw}
.label{position:absolute;transform:translate(-50%,-50%);font-size:1.45cqw;font-weight:900;color:var(--soft);white-space:nowrap;pointer-events:none;z-index:3}
.hot{filter:drop-shadow(0 0 1.4cqw #ffc83d)!important}
/* glassware */
.beaker{width:20cqw;height:24cqw;z-index:4}
.beaker .glass{position:absolute;inset:0;border:.6cqw solid #ffffffee;border-top:none;border-radius:0 0 3cqw 3cqw;background:#ffffff66;overflow:hidden;box-shadow:inset .8cqw 0 0 #ffffff88,0 .6cqw 1.6cqw #0001}
.beaker .rim{position:absolute;left:-1.2cqw;right:-1.2cqw;top:-.6cqw;height:1.2cqw;border-radius:1cqw;background:#ffffffee;box-shadow:0 .2cqw 0 #0001}
.liquid{position:absolute;left:0;right:0;bottom:0;transition:height .4s,background .6s}
.marks{position:absolute;left:12%;top:20%;bottom:15%;width:12%;background:repeating-linear-gradient(180deg,#9fb4c4 0 .25cqw,transparent .25cqw 3cqw);opacity:.6}
.bottle{width:5cqw;height:7cqw;border-radius:1.2cqw 1.2cqw 1.6cqw 1.6cqw;box-shadow:inset -.6cqw 0 0 #0002}
.bottle:before{content:"";position:absolute;left:30%;right:30%;top:-1.6cqw;height:1.8cqw;background:#444;border-radius:.4cqw}
.drop{width:3.6cqw;height:3.6cqw;border-radius:50% 50% 50% 0;transform:translate(-50%,-50%) rotate(-45deg);box-shadow:inset -.4cqw -.4cqw 0 #0002}
.meter{position:absolute;height:1.2cqw;background:#fff;border-radius:1cqw;overflow:hidden;box-shadow:0 0 0 .2cqw #0001;z-index:6}
.meter i{display:block;height:100%;width:0;background:var(--lab);transition:width .1s}
.volcano{width:38cqw;height:26cqw;z-index:3;pointer-events:none}
.volcano .cone{position:absolute;inset:0;background:linear-gradient(90deg,#8a5a3c,#a8714b 50%,#7a4f34);clip-path:polygon(0 100%,40% 4%,60% 4%,100% 100%)}
.volcano .crater{position:absolute;left:39%;right:39%;top:0;height:9%;background:#4a3022;border-radius:50%}
.volcano .pile{position:absolute;left:43%;right:43%;top:-6%;height:10%;background:#fff;border-radius:50% 50% 20% 20%;transition:transform .3s}
.jar{width:20cqw;height:26cqw;z-index:4}
.jar .glass{position:absolute;inset:0;border:.6cqw solid #ffffffee;border-radius:2cqw 2cqw 3cqw 3cqw;background:#ffffff55;overflow:hidden;box-shadow:inset .8cqw 0 0 #ffffff88,0 .6cqw 1.6cqw #0001}
.jar .lid{position:absolute;left:-1cqw;right:-1cqw;top:-2cqw;height:2.2cqw;border-radius:1cqw;background:#c9a06a}
.jar .stick{position:absolute;left:-4cqw;right:-4cqw;top:-3.2cqw;height:1.2cqw;border-radius:1cqw;background:#9a6b3c;z-index:2}
.jar .string{position:absolute;left:50%;top:-2cqw;width:.3cqw;height:78%;background:#7a6a5a;transform:translateX(-50%);z-index:2}
.crys{position:absolute;transform:translate(-50%,-50%) rotate(45deg);box-shadow:inset -.3cqw -.3cqw 0 #0002,0 0 1cqw #fff8;animation:grow .6s ease-out}
.salt{position:absolute;width:.6cqw;height:.6cqw;background:#fff;border-radius:.1cqw;box-shadow:0 0 0 .1cqw #0001}
.pad{width:18cqw;height:3cqw;background:#8a96a8;border-radius:1cqw;z-index:3}
.rocket{font-size:12cqw;z-index:5;transition:none}
.pump{width:6cqw;height:13cqw;z-index:4;pointer-events:none}
.pump .body{position:absolute;left:20%;right:20%;top:30%;bottom:0;background:#4aa3df;border-radius:1cqw;box-shadow:inset -.6cqw 0 0 #0002}
.pump .base{position:absolute;left:-10%;right:-10%;bottom:-1cqw;height:1.4cqw;background:#2c7bb3;border-radius:1cqw}
.handle{width:10cqw;height:2cqw;background:#555;border-radius:1cqw;cursor:grab;touch-action:none;z-index:12}
.handle:after{content:"";position:absolute;left:46%;top:100%;width:8%;height:6cqw;background:#888}
.gauge{width:4cqw;height:22cqw;background:#fff;border-radius:2cqw;box-shadow:0 0 0 .3cqw #0001;overflow:hidden;z-index:4}
.gauge i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#3bb273,#ffd43b,#ef4444);transition:height .2s}
.launch{z-index:12;background:#ef4444;color:#fff;border:.4cqw solid #b91c1c;border-radius:50%;width:12cqw;height:12cqw;font-size:2cqw;font-weight:900;box-shadow:0 .8cqw 0 #b91c1c;padding:0}
.marker{position:absolute;left:4%;font-size:2cqw;font-weight:900;color:var(--soft);z-index:2;display:flex;gap:.6cqw;align-items:center}
.marker span{font-size:4cqw}
.bin{width:22cqw;height:14cqw;border-radius:1.6cqw;border:.5cqw dashed;display:grid;place-items:start center;padding-top:.8cqw;font-size:1.8cqw;font-weight:900;z-index:2;text-align:center}
.bin.yes{background:#fff1f1;border-color:#ef4444;color:#b91c1c}
.bin.no{background:#f2f5f9;border-color:#94a3b8;color:#475569}
.obj{font-size:5cqw;z-index:6}
.tank{width:42cqw;height:30cqw;z-index:3;pointer-events:none}
.tank .glass{position:absolute;inset:0;border:.6cqw solid #ffffffee;border-top:none;border-radius:0 0 1.6cqw 1.6cqw;background:#ffffff55;overflow:hidden;box-shadow:0 .6cqw 1.6cqw #0001}
.tank .water{position:absolute;left:0;right:0;bottom:0;height:78%;background:linear-gradient(180deg,#8fd6ffcc,#3a9be0cc)}
.tank .water:before{content:"";position:absolute;left:0;right:0;top:-.6cqw;height:1.2cqw;background:radial-gradient(ellipse at 50% 100%,#c8ecff 0 60%,transparent 62%) 0 0/5cqw 100% repeat-x}
.bob{animation:bob 1.6s ease-in-out infinite}
.fx{position:absolute;transform:translate(-50%,-50%);font-size:3cqw;font-weight:900;pointer-events:none;animation:rise 1.3s ease-out forwards;z-index:60;color:var(--lab-deep);text-shadow:0 .2cqw 0 #fff;white-space:nowrap}
.big-note{position:absolute;left:38%;top:16%;transform:translate(-50%,-50%);background:#fff;border-radius:2cqw;padding:1.2cqw 2.4cqw;font-size:3cqw;font-weight:900;z-index:30;box-shadow:0 .8cqw 0 #0001;text-align:center;animation:pop .4s ease-out;white-space:nowrap}
/* notebook */
dialog{border:none;border-radius:26px;padding:0;background:var(--paper);color:var(--ink);width:min(640px,calc(100vw - 20px));max-height:calc(100dvh - 24px);box-shadow:0 30px 80px #21362e55}
dialog::backdrop{background:#21362e66;backdrop-filter:blur(4px)}
.dlg{padding:18px 16px 16px;display:grid;gap:12px}
.dlg header{display:flex;align-items:center;gap:8px}
.dlg h2{margin:0;font-size:24px;letter-spacing:-.4px}
.dlg header h2{margin-right:auto}
.book{display:grid;gap:12px;max-height:min(66dvh,600px);overflow:auto;padding:4px;background:repeating-linear-gradient(180deg,#fff 0 29px,#dbe8f5 29px 30px)}
.page{display:grid;gap:6px;padding:10px 12px;border-radius:14px;background:#ffffffee;border:2px solid var(--line)}
.page h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.page .row{display:flex;flex-wrap:wrap;gap:6px}
.page .tag{padding:4px 8px;border-radius:999px;font-size:13px;font-weight:800;background:#f1f6f3;border:1.5px solid var(--line)}
.page .sw{width:22px;height:22px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1.5px #0002;vertical-align:middle}
.page .fact{font-size:13px;color:var(--soft);font-weight:700;margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:70;max-width:calc(100vw - 30px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -.8cqw}}
@keyframes grow{from{scale:0}to{scale:1}}
@keyframes pop{0%{scale:0}70%{scale:1.15}100%{scale:1}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-220%) scale(1.1)}}
@media (max-width:700px){.exps{grid-template-columns:1fr 1fr}.title strong{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <div class="topbar">
  <a class="home" href="/" aria-label="Back to all games">← Games</a>
  <div class="title"><small>Super Emilia</small><strong>Science Lab</strong></div>
  <span class="chip" id="badgeChip" aria-label="Science badges">🏅 0 / 6</span>
  <button type="button" id="bookBtn">📓 Notebook</button>
  <button type="button" id="soundBtn" aria-pressed="true">🔊</button>
 </div>
 <section id="homeView">
  <div class="hero">
   <h1>🧪 Welcome to your science lab!</h1>
   <p>Pick an experiment. Everything you discover goes in your 📓 notebook, and you win a 🏅 badge for mastering each experiment.</p>
   <div class="exps" id="exps"></div>
  </div>
 </section>
 <section id="expView" hidden>
  <div class="bar"><h2 id="expTitle"></h2><button type="button" id="againBtn">🔄 Start over</button><button type="button" id="labBtn">🏠 Lab</button></div>
  <p class="tip" id="tip" role="status"></p>
  <section class="scene" id="scene" aria-label="Experiment"></section>
 </section>
</div>
<dialog id="bookDialog" aria-labelledby="bookTitle"><div class="dlg">
 <header><h2 id="bookTitle">📓 My science notebook</h2><button type="button" id="bookClose" aria-label="Close the notebook">✕</button></header>
 <div class="book" id="book"></div>
</div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
// ---------- game data ----------
const PAINTS=[{id:'red',name:'Red',hex:'#ef3b3b'},{id:'yellow',name:'Yellow',hex:'#ffd21f'},{id:'blue',name:'Blue',hex:'#2f6fe0'},{id:'white',name:'White',hex:'#ffffff'}];
// what you get when you stir paints together (by which paints are in the beaker)
const MIXES=[
 {id:'red',name:'Red',hex:'#ef3b3b',of:['red']},{id:'yellow',name:'Yellow',hex:'#ffd21f',of:['yellow']},{id:'blue',name:'Blue',hex:'#2f6fe0',of:['blue']},{id:'white',name:'White',hex:'#f6f6f6',of:['white']},
 {id:'orange',name:'Orange',hex:'#ff8a1f',of:['red','yellow']},{id:'green',name:'Green',hex:'#2fb24c',of:['yellow','blue']},{id:'purple',name:'Purple',hex:'#8a3fd1',of:['red','blue']},
 {id:'pink',name:'Pink',hex:'#ff8fc0',of:['red','white']},{id:'skyblue',name:'Sky blue',hex:'#8cc4ff',of:['blue','white']},{id:'cream',name:'Cream',hex:'#fff1a8',of:['yellow','white']},
 {id:'brown',name:'Brown',hex:'#7a4a26',of:['red','yellow','blue']},{id:'lavender',name:'Lavender',hex:'#c8a6f2',of:['red','blue','white']},{id:'mint',name:'Mint',hex:'#9ce8b4',of:['yellow','blue','white']},{id:'peach',name:'Peach',hex:'#ffbf94',of:['red','yellow','white']},
 {id:'tan',name:'Tan',hex:'#c9a37a',of:['red','yellow','blue','white']}];
const LAVAS=[{id:'red',name:'Red',hex:'#ff4d3d'},{id:'green',name:'Green',hex:'#4cd964'},{id:'purple',name:'Purple',hex:'#b06bff'}];
const ERUPTIONS=[{id:'small',name:'Small',icon:'💨'},{id:'medium',name:'Medium',icon:'🫧'},{id:'big',name:'Big',icon:'🌋'},{id:'mega',name:'MEGA',icon:'💥'}];
const CRYSTALS=[{id:'clear',name:'Clear',hex:'#e8f4ff'},{id:'pink',name:'Pink',hex:'#ff9ccc'},{id:'blue',name:'Blue',hex:'#6fb6ff'},{id:'purple',name:'Purple',hex:'#b98cff'},{id:'green',name:'Green',hex:'#7be3a0'},{id:'gold',name:'Gold',hex:'#ffd447'}];
const HEIGHTS=[{icon:'🏠',name:'Over a house',need:1},{icon:'🌳',name:'Over a tall tree',need:3},{icon:'🏢',name:'Past a skyscraper',need:5},{icon:'☁️',name:'Up to the clouds',need:7},{icon:'✈️',name:'Higher than a plane',need:9},{icon:'🌙',name:'To space! (pretend)',need:10}];
const MAGNET_ITEMS=[{id:'clip',icon:'📎',name:'Paper clip',mag:true},{id:'bolt',icon:'🔩',name:'Bolt',mag:true},{id:'key',icon:'🔑',name:'Key',mag:true},{id:'scissors',icon:'✂️',name:'Scissors',mag:true},{id:'screw',icon:'🪛',name:'Screwdriver',mag:true},{id:'pin',icon:'🧷',name:'Safety pin',mag:true},
 {id:'apple',icon:'🍎',name:'Apple',mag:false},{id:'pencil',icon:'✏️',name:'Pencil',mag:false},{id:'teddy',icon:'🧸',name:'Teddy bear',mag:false},{id:'feather',icon:'🪶',name:'Feather',mag:false},{id:'coin',icon:'🪙',name:'Penny',mag:false},{id:'sponge',icon:'🧽',name:'Sponge',mag:false}];
const FLOAT_ITEMS=[{id:'rock',icon:'🪨',name:'Rock',floats:false},{id:'duck',icon:'🦆',name:'Rubber duck',floats:true},{id:'coin',icon:'🪙',name:'Coin',floats:false},{id:'apple',icon:'🍎',name:'Apple',floats:true},{id:'key',icon:'🔑',name:'Key',floats:false},{id:'wood',icon:'🪵',name:'Wood',floats:true},
 {id:'ball',icon:'⚽',name:'Ball',floats:true},{id:'bolt',icon:'🔩',name:'Bolt',floats:false},{id:'lemon',icon:'🍋',name:'Lemon',floats:true},{id:'egg',icon:'🥚',name:'Egg',floats:false},{id:'leaf',icon:'🍃',name:'Leaf',floats:true},{id:'marble',icon:'🔮',name:'Marble',floats:false}];
const EXPERIMENTS=[
 {id:'color',icon:'🎨',name:'Color Mixing',about:'Mix paints to discover new colors',fact:'Red, yellow and blue are primary colors. Mixing two of them makes a secondary color, like orange, green or purple!'},
 {id:'volcano',icon:'🌋',name:'Volcano',about:'Baking soda + vinegar = ERUPTION!',fact:'Baking soda and vinegar react and make a gas called carbon dioxide. The gas bubbles push the foam up and out!'},
 {id:'crystal',icon:'💎',name:'Crystal Garden',about:'Grow sparkly crystals on a string',fact:'When salty water dries up, the salt comes back together in neat shapes called crystals.'},
 {id:'rocket',icon:'🚀',name:'Bottle Rocket',about:'Pump up the pressure and launch',fact:'Pumping squeezes lots of air into the bottle. When it lets go, the air rushes out one way and pushes the rocket the other way!'},
 {id:'magnet',icon:'🧲',name:'Magnets',about:'Find out what sticks to a magnet',fact:'Magnets pull on things made of iron and steel. Wood, plastic, paper and even pennies are not magnetic!'},
 {id:'float',icon:'🌊',name:'Sink or Float',about:'Drop things in water and watch',fact:'Things float when they are lighter than the same amount of water. Heavy, solid things like rocks and keys sink.'}];
const SAVE_KEY='superEmiliaLab';

// ---------- pure game logic (also used by the tests) ----------
const byId=(list,id)=>list.find(x=>x.id===id);
// the color you get from a set of paints (order and amounts do not matter)
function mixColor(paints){const set=[...new Set(paints)].sort().join(',');return MIXES.find(m=>[...m.of].sort().join(',')===set)||null}
// eruption size: more baking soda makes a bigger eruption, and dish soap makes it foamier
function eruptionType(soda,soap){if(soda<=0)return null;if(soda>=3&&soap)return'mega';if(soda>=3||(soda===2&&soap))return'big';if(soda===2||soap)return'medium';return'small'}
// how high the rocket goes: the highest height whose pumps you reached (0 pumps: no launch)
function rocketLevel(pumps){let lv=-1;HEIGHTS.forEach((h,i)=>{if(pumps>=h.need)lv=i});return lv}
const addOnce=(list,id)=>{if(list.includes(id))return false;list.push(id);return true};
// recording discoveries: each returns true when it is new
const record={
 color:(s,id)=>byId(MIXES,id)?addOnce(s.colors,id):false,
 eruption:(s,type,lava)=>{if(!byId(ERUPTIONS,type))return false;const a=addOnce(s.eruptions,type),b=lava&&byId(LAVAS,lava)?addOnce(s.lavas,lava):false;s.runs++;return a||b},
 crystal:(s,id)=>{if(!byId(CRYSTALS,id))return false;s.runs++;return addOnce(s.crystals,id)},
 rocket:(s,lv)=>{if(lv<0)return false;s.runs++;const better=lv>s.rocketBest;if(better)s.rocketBest=lv;return better},
 magnet:(s,id)=>{const it=byId(MAGNET_ITEMS,id);if(!it)return false;return addOnce(s.magnets,id)},
 float:(s,id)=>{const it=byId(FLOAT_ITEMS,id);if(!it)return false;return addOnce(s.floats,id)}};
// mastering an experiment wins its badge
const BADGES={color:s=>s.colors.length>=10,volcano:s=>s.eruptions.includes('mega'),crystal:s=>s.crystals.length>=3,rocket:s=>s.rocketBest>=HEIGHTS.length-1,magnet:s=>s.magnets.length>=MAGNET_ITEMS.length,float:s=>s.floats.length>=FLOAT_ITEMS.length};

 function place(o,bin,mag){o.done=true;sorted++;o.el.style.transition='left .3s,top .3s';o.el.style.left=(bin.x-7+(objs.filter(z=>z.done&&z.it.mag===mag).length-1)%4*4.6)+'%';o.el.style.top=(bin.y+3)+'%';o.el.style.fontSize='3.4cqw';
  const had=BADGES.magnet(S);record.magnet(S,o.it.id);save();fx(bin.x,bin.y-8,(mag?'🧲 ':'🚫 ')+o.it.name);if(sorted>=round.length){sfx.wow();note('✅ All sorted!');setTip('🧲 Great sorting! Magnets pull on iron and steel. Tap <b>🔄 Start over</b> to test more things. ('+S.magnets.length+' of '+MAGNET_ITEMS.length+' tested)');checkBadge('magnet',had)}}
 el('tray');const mg=el('p grab emo',88,30,'🧲');mg.style.fontSize='8cqw';mg.setAttribute('aria-label','Drag the magnet over the things');label(88,42,'Magnet');
 draggable(mg,()=>({x:88,y:30}),{onMove:q=>{for(const o of objs){if(o.done||stuck.includes(o))continue;const d=Math.hypot(o.x-q.x,(o.y-q.y)*.62);if(d<8){if(o.it.mag){stuck.push(o);sfx.clink();fx(q.x,q.y-8,'Stuck!')}else if(!o.tested){o.tested=true;o.el.animate([{translate:'0 0'},{translate:'-.8cqw 0'},{translate:'.8cqw 0'},{translate:'0 0'}],{duration:300});fx(o.x,o.y-7,'Not stuck')}}}
   stuck.forEach((o,i)=>{o.el.style.left=(q.x-3+i*3)+'%';o.el.style.top=(q.y+7)+'%'});by.classList.toggle('hot',near(q,YES,13,10)&&stuck.length>0)},
  onEnd:()=>by.classList.remove('hot'),onDrop:q=>{if(!stuck.length)return false;if(near(q,YES,13,10)){const list=stuck;stuck=[];list.forEach(o=>place(o,YES,true));sfx.plop();return false}
   // let go somewhere else: stuck things fall back onto the table
   stuck.forEach(o=>{o.x=Math.max(8,Math.min(68,parseFloat(o.el.style.left)));o.y=Math.max(50,Math.min(90,parseFloat(o.el.style.top)));o.el.style.left=o.x+'%';o.el.style.top=o.y+'%'});stuck=[];setTip('🧲 They fell off! Drag the magnet over the <b>Magnetic</b> box to drop stuck things in.');return false}});
 setTip('🧲 Drag the <b>magnet</b> over the things. Bring stuck things to the <b>🧲 Magnetic</b> box. Drag things that do not stick into <b>🚫 Not magnetic</b>.')}

function float(){const T={x:38,y:58,w:42,h:30},round=pickRound(FLOAT_ITEMS,6);let done=0;
 const tk=el('p tank',T.x,T.y,'<div class="glass"><div class="water"></div></div>');const surface=T.y-T.h/2*1.6*.78+2,bottom=T.y+T.h/2*1.6-4;
 const target=()=>({x:T.x,y:T.y,dx:20,dy:24,el:tk});el('tray');
 round.forEach((it,i)=>{const x=i%2?93:83,y=12+Math.floor(i/2)*22;const d=dropper('emo',x,y,it.icon,'Drop the '+it.name.toLowerCase()+' into the water',target,q=>{d.remove();const o=el('p obj',Math.max(T.x-17,Math.min(T.x+17,q.x)),q.y,it.icon);sfx.splash();
   const toY=it.floats?surface+1.5:bottom-2-(done%3)*1.5;o.animate([{top:q.y+'%'},{top:toY+'%'}],{duration:it.floats?600:1400,easing:it.floats?'cubic-bezier(.3,1.6,.5,1)':'ease-in',fill:'forwards'});o.style.top=toY+'%';if(it.floats)setTimeout(()=>o.classList.add('bob'),700);
   setTimeout(()=>{fx(parseFloat(o.style.left),toY-8,it.floats?'It floats!':'It sinks!');const had=BADGES.float(S);record.float(S,it.id);save();done++;setTip((it.floats?'🛟 The <b>'+it.name.toLowerCase()+'</b> floats!':'⬇️ The <b>'+it.name.toLowerCase()+'</b> sinks!')+(done<round.length?' Try another one.':' You tested them all! Tap <b>🔄 Start over</b> for new things. ('+S.floats.length+' of '+FLOAT_ITEMS.length+' tested)'));if(done>=round.length){sfx.wow();checkBadge('float',had)}},it.floats?600:1400);return true});const lb=label(x,y+8,it.name);d.addEventListener('pointerup',()=>{if(!d.isConnected)lb.remove()})});
 setTip('🌊 What do you think: will it sink or float? <b>Drag something</b> into the water to find out!')}
